<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 838 268" width="838" height="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9198a1"/></marker></defs>
<rect x="8" y="24" width="128" height="52" rx="8" fill="none" stroke="#3d444d" stroke-width="1.3"/>
<text x="72.0" y="55.0" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="middle">coils + a flux</text>
<line x1="136" y1="50" x2="176" y2="50" stroke="#9198a1" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="178" y="24" width="196" height="52" rx="8" fill="none" stroke="#3d444d" stroke-width="1.3"/>
<text x="276.0" y="46.5" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="middle">solve for the surface</text>
<text x="276.0" y="63.5" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="middle">Newton, to the last digit</text>
<line x1="374" y1="50" x2="442" y2="50" stroke="#9198a1" stroke-width="1.3" marker-end="url(#a)"/>
<text x="408.0" y="43.0" font-size="12" fill="#9198a1" text-anchor="middle">converges</text>
<rect x="444" y="24" width="196" height="52" rx="8" fill="none" stroke="#3d444d" stroke-width="1.3"/>
<text x="542.0" y="46.5" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="middle">check it again</text>
<text x="542.0" y="63.5" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="middle">different code, 4,096 points</text>
<line x1="640" y1="50" x2="696" y2="50" stroke="#9198a1" stroke-width="1.3" marker-end="url(#a)"/>
<text x="668.0" y="43.0" font-size="12" fill="#9198a1" text-anchor="middle">agrees</text>
<rect x="698" y="24" width="132" height="52" rx="8" fill="none" stroke="#1fe0b4" stroke-width="1.3"/>
<text x="764.0" y="55.0" font-size="14" font-weight="700" fill="#3fe6c0" text-anchor="middle">surface</text>
<line x1="276" y1="76" x2="276" y2="114" stroke="#9198a1" stroke-width="1.3" marker-end="url(#a)"/>
<text x="284.0" y="99.0" font-size="12" fill="#9198a1" text-anchor="start">fails</text>
<rect x="120" y="116" width="312" height="52" rx="8" fill="none" stroke="#3d444d" stroke-width="1.3"/>
<text x="276.0" y="138.5" font-size="14" font-weight="400" fill="#f0f6fc" text-anchor="middle">find what forbids a surface</text>
<text x="276.0" y="155.5" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="middle">an island chain, or the edge of confinement</text>
<line x1="276" y1="168" x2="276" y2="206" stroke="#9198a1" stroke-width="1.3" marker-end="url(#a)"/>
<text x="284.0" y="191.0" font-size="12" fill="#9198a1" text-anchor="start">found and bounded</text>
<rect x="178" y="208" width="196" height="52" rx="8" fill="none" stroke="#f0f6fc" stroke-width="1.3"/>
<text x="276.0" y="230.5" font-size="14" font-weight="700" fill="#f0f6fc" text-anchor="middle">no surface</text>
<text x="276.0" y="247.5" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="middle">with a certificate</text>
<line x1="432" y1="142" x2="536" y2="142" stroke="#9198a1" stroke-width="1.3" marker-end="url(#a)"/>
<text x="484.0" y="135.0" font-size="12" fill="#9198a1" text-anchor="middle">out of time</text>
<line x1="604" y1="76" x2="604" y2="114" stroke="#9198a1" stroke-width="1.3" marker-end="url(#a)"/>
<text x="612.0" y="99.0" font-size="12" fill="#9198a1" text-anchor="start">disagrees</text>
<rect x="538" y="116" width="196" height="52" rx="8" fill="none" stroke="#3d444d" stroke-width="1.3"/>
<text x="636.0" y="138.5" font-size="14" font-weight="700" fill="#f0f6fc" text-anchor="middle">undetermined</text>
<text x="636.0" y="155.5" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="middle">never a guess</text>
</svg>
